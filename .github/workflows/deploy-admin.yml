name: Deploy Admin to Cloudflare Pages

# The admin app is its own deployable: separate build, separate origin, never part of
# the GitHub Pages artifact. It is a static export, so any static host will do —
# Cloudflare Pages is the one wired up here.
on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

concurrency:
  group: admin-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Gated on the repo variable so the workflow stays green in a fork or before the
    # Cloudflare project exists. Set ADMIN_CF_PROJECT to the Pages project name to arm it.
    if: vars.ADMIN_CF_PROJECT != ''
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build admin
        run: npm run build:admin
        env:
          # Public, inlined into the client bundle — the admin app is entirely
          # client-fetched against the FastAPI backend.
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Link back to the public/portal app (its own origin, same as this one).
          NEXT_PUBLIC_WEB_URL: ${{ vars.WEB_URL }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/admin/out --project-name=${{ vars.ADMIN_CF_PROJECT }} --branch=main
