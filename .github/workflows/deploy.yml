name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Only the org repo serves the site. This file is synced there by
    # sync-pages-repo.yml, so it must stay in the source tree — guarding on the
    # repository name is what stops *this* repo also publishing a copy, which it can
    # only serve from a subpath its own bundle cannot boot from.
    if: github.repository == 'mkalaimalai-residence/mkalaimalai-residence.github.io'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Wake the free-tier API (Render sleeps when idle) so build-time fetches hit a warm
      # instance. Best-effort: if it never wakes, ALLOW_SEED_FALLBACK below covers the build.
      - name: Pre-warm API
        if: vars.API_BASE_URL != ''
        run: curl --max-time 90 --retry 5 --retry-all-errors "${{ vars.API_BASE_URL }}/healthz" || true

      - name: Build
        run: npm run build
        env:
          # Set repo variable DATA_SOURCE=api to source public pages from the live API;
          # leave unset to keep building from the local seed (default, zero-config).
          DATA_SOURCE: ${{ vars.DATA_SOURCE }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          # If the API is asleep/unreachable at build time, fall back to seed so the deploy
          # still publishes (content just lags until the next build).
          ALLOW_SEED_FALLBACK: "1"
          # Public, inlined into the client bundle for the portal's live data + auth.
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # The admin app deploys separately (Cloudflare Pages, see deploy-admin.yml);
          # this is the only thing tying the two origins together. Unset means the
          # localhost dev fallback ships to production, so set the ADMIN_URL repo variable.
          # The admin app is now mounted under this same origin at /admin (built and
          # copied in the step below), so this is a path, not a cross-origin URL.
          NEXT_PUBLIC_ADMIN_URL: /admin

      # The admin app keeps its own Next build — separate deps, separate config — but its
      # export is nested into the web export so both ship in one Pages artifact and the
      # admin UI stays on this origin instead of redirecting to another host.
      #
      # ADMIN_BASE_PATH is what makes the nesting work: it prefixes every route and asset
      # URL with /admin. Without it the copied app would request /_next/... and be served
      # the web app's chunks.
      - name: Build admin (mounted at /admin)
        run: npm run build:admin
        env:
          ADMIN_BASE_PATH: /admin
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_WEB_URL: ${{ vars.WEB_URL }}

      - name: Nest the admin export into the web export
        run: |
          set -euo pipefail
          # Fail loudly rather than publishing a half-built site.
          test -d apps/admin/out || { echo "admin export missing"; exit 1; }
          # apps/web no longer has an /admin route, so this must not be overwriting
          # anything — if it exists, the two builds are fighting over the path.
          test ! -e apps/web/out/admin || { echo "apps/web/out/admin already exists"; exit 1; }
          cp -R apps/admin/out apps/web/out/admin
          test -f apps/web/out/admin/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          # The web app moved to apps/web in the monorepo split; the root `build` script
          # delegates to that workspace, so only the artifact path changes here.
          path: ./apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.repository == 'mkalaimalai-residence/mkalaimalai-residence.github.io'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
